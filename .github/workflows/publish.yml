# 08:00, 12:00, 20:00 KST마다 게시 시각이 지난 승인된 게시물 하나를 올립니다.
# GitHub cron은 수십 분 늦게 돌 수 있습니다. 수동 실행은 기본이 dry-run입니다.
name: publish
on:
  schedule:
    - cron: '0 23,3,11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '컨테이너만 만들고 실제로 게시하지 않기'
        type: boolean
        default: true
      post:
        description: '특정 게시물 id (예: 2026-W43-01). 비우면 차례인 것'
        required: false
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node src/publish.ts ${POST:+--post "$POST"} $([ "$DRY_RUN" = true ] && echo --dry-run)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          POST: ${{ inputs.post }}
      - name: Save publish log
        if: always()
        run: |
          git diff --quiet data && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m 'posted: update log'
          git pull --rebase origin main
          git push origin HEAD:main
